<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- Use Google Docs Viewer for better mobile compatibility, with a fallback link -->
    <iframe src="https://docs.google.com/viewer?url=https://dengsherry2003-ui.github.io/Final_Project/report.pdf&embedded=true" title="Report PDF"></iframe>
    
    <!-- Fallback if iframe fails -->
    <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 5px;">
        <a href="report.pdf" target="_blank" style="font-family: sans-serif; text-decoration: none; color: #333;">Click here if the PDF doesn't display</a>
    </div>
</body>
</html>
